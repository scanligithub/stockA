name: Build SSE SZSE Delisted Stock Universe

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1-5"

permissions:
  contents: read

jobs:
  build-delisted-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Build SSE/SZSE delisted stock universe
        run: python scripts/download_delisted_stocks.py

      - name: Show result
        run: |
          echo "=== Counts ==="
          wc -l data/universe/a_share_delisted_all.csv
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("data/universe/a_share_delisted_all.csv", dtype={"code": str})
          print(f"unique codes: {df['code'].nunique()}")
          print(f"SSE: {(df['exchange'] == 'SSE').sum()}")
          print(f"SZSE: {(df['exchange'] == 'SZSE').sum()}")
          print(f"date range: {df['delist_date'].min()} -> {df['delist_date'].max()}")
          PY

      - name: Upload result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sse-szse-delisted-universe-${{ github.run_id }}
          path: |
            data/universe/a_share_delisted_all.csv
            data/universe/sse_delisted.csv
            data/universe/szse_delisted.csv
          if-no-files-found: error
          retention-days: 14
