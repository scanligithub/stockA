name: Test TDX Index Fetch Pipeline

on:
  workflow_dispatch:

jobs:
  test-index-fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow

      - name: Download Go dependencies
        working-directory: test/tdx_index_api
        run: |
          go mod tidy
          go mod download

      - name: Fetch index data
        working-directory: test/tdx_index_api
        run: |
          go run . -out temp_index_kline.csv

      - name: Test Python processing
        working-directory: test/tdx_index_api
        run: |
          python test_fetch_index.py
