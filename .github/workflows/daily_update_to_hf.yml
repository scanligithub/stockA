# FILE: .github/workflows/daily_update_to_hf.yml
name: Daily Update to Hugging Face

on:
  repository_dispatch:
    types: [daily_update]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 🌐 Download Official GBBQ zip (HTTP Mode)
        run: |
          set -euxo pipefail
          URL="http://www.tdx.com.cn/products/data/data/dbf/gbbq.zip"
          curl -L \
               --retry 3 \
               --retry-delay 5 \
               --connect-timeout 30 \
               -o gbbq.zip \
               "${URL}"
          unzip -o gbbq.zip
          mv gbbq gbbq.dat
          ls -lh gbbq.dat

      - name: Install Python GBBQ Decryptor Deps
        run: pip install pytdx pandas

      - name: Run Python GBBQ Decoder (1 second)
        run: |
          python scripts/parse_gbbq.py gbbq.dat gbbq_clean.csv
          ls -lh gbbq_clean.csv

      - name: Initialize Go Module
        run: |
          go mod init stockA || true
          go get github.com/injoyai/tdx
          go mod tidy

      - id: set-matrix
        name: Build Engine & Generate Matrix
        run: |
          go build -o tdx_fetcher scripts/tdx_fetcher.go
          python scripts/prepare_matrix.py
          echo "matrix=$(cat stock_matrix.json)" >> $GITHUB_OUTPUT

      - name: Upload Master Metadata (List & GBBQ)
        uses: actions/upload-artifact@v4
        with:
          name: master-metadata
          path: |
            stock_list_master.json
            gbbq_clean.csv
          retention-days: 1

  fetch-daily-data:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Download Master Metadata
        uses: actions/download-artifact@v4
        with:
          name: master-metadata
          path: .

      - name: Install Python & Go Dependencies
        run: |
          pip install -r requirements.txt
          go mod init stockA || true
          go get github.com/injoyai/tdx
          go mod tidy

      - name: Build TDX Go Engine
        run: go build -o tdx_fetcher scripts/tdx_fetcher.go

      - name: Fetch Current Year Daily Data (Local gbbq_clean.csv + Sina Flow)
        run: |
          python scripts/fetch_worker.py \
            --index ${{ matrix.task.index }} \
            --codes '${{ toJson(matrix.task.codes) }}' \
            --year 0

      - uses: actions/upload-artifact@v4
        with:
          name: daily-part-${{ matrix.task.index }}
          path: temp_parts/*.parquet
          retention-days: 1

  fetch-sectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Go Dependencies & Build Engine
        run: |
          go mod init stockA || true
          go get github.com/injoyai/tdx
          go mod tidy
          go build -o tdx_fetcher scripts/tdx_fetcher.go

      - name: Install Runtime Dependencies
        run: |
          pip install -r requirements.txt
          pip install polars pytdx

      - name: Install Playwright
        run: playwright install chromium

      - name: Download Latest Healed Sectors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo scanligithub/em-sector-auto-healer --pattern "Full_Sector_Klines.zip" --clobber

      - name: Transform JSON to Clean Parquet
        run: python scripts/import_healed_sectors.py

      - name: 📈 Fetch Daily Incremental Index Data
        run: python scripts/fetch_index.py --incremental

      - name: Upload Sector Parquet
        uses: actions/upload-artifact@v4
        with:
          name: sector-parts
          path: |
            temp_parts/*.parquet
            temp_parts/metadata/
          retention-days: 1

  finalize:
    needs: [fetch-daily-data, fetch-sectors]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Finalize Dependencies
        run: |
          pip install -r requirements.txt
          pip install polars baostock

      - name: Install Playwright
        run: playwright install chromium

      - name: Restore XQ Token Cache
        uses: actions/cache/restore@v4
        with:
          path: cache/xq_token.json
          key: xq-token-cache-${{ github.run_id }}
          restore-keys: |
            xq-token-cache-

      - name: Download Master List (For DuckDB Metadata)
        uses: actions/download-artifact@v4
        with:
          name: master-metadata
          path: .

      - name: Download All Data Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-part*'
          merge-multiple: true
          path: all_artifacts

      - name: Copy Sector Metadata to Output
        run: |
          mkdir -p output/metadata
          cp all_artifacts/metadata/* output/metadata/ 2>/dev/null || true

      - name: 🌐 Sync All Stocks 37-Column F10 Financial Data
        run: |
          python scripts/fetch_f10_all.py
          ls -lh output/all_stocks_f10_raw.parquet

      - name: ❄️ Fetch All Stocks Full Historical Main Operating Business Detail
        run: |
          python scripts/fetch_f10_mainbus.py
          ls -lh output/all_stocks_mainbus_raw.parquet

      - name: Save XQ Token Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/xq_token.json
          key: xq-token-cache-${{ github.run_id }}

      - name: 💾 Restore Earnings Forecast Events from GitHub Cache
        uses: actions/cache/restore@v4
        id: restore-event-cache
        with:
          path: output/event_earnings_forecast.parquet
          key: event-forecast-cache-placeholder
          restore-keys: |
            event-forecast-cache-

      - name: 🛡️ Fallback if No Cache Exists
        run: |
          if [ ! -f output/event_earnings_forecast.parquet ]; then
            echo "⚠️ 未在本地磁盘检测到历史事件文件，启动全新仓库自动初始化..."
            mkdir -p output
            python -c "
            import polars as pl
            schema = {
                'code': pl.Utf8, 'notice_date': pl.Utf8, 'report_date': pl.Utf8,
                'forecast_type': pl.Utf8, 'forecast_yoy_mid': pl.Float64, 'summary': pl.Utf8
            }
            pl.DataFrame([], schema=schema).write_parquet('output/event_earnings_forecast.parquet')
            "
          else
            echo "✅ 物理检测通过：已成功加载 Actions 缓存恢复的历史事件数据（大小：$(ls -lh output/event_earnings_forecast.parquet | awk '{print $5}')）。"
          fi

      - name: Download Latest Successful Index Membership Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RUN_ID="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build-index-membership.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "❌ No successful Build Index Historical Membership workflow run found."
            exit 1
          fi

          ARTIFACT_NAME="index-membership-history-${RUN_ID}"
          echo "Using successful membership build run: $RUN_ID"
          echo "Artifact: $ARTIFACT_NAME"

          rm -rf /tmp/index_membership_artifact
          mkdir -p /tmp/index_membership_artifact

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir /tmp/index_membership_artifact

          MEMBERSHIP_FILE="$(find /tmp/index_membership_artifact -type f -name 'index_membership_history.parquet' -print -quit)"
          if [ -z "$MEMBERSHIP_FILE" ]; then
            echo "❌ index_membership_history.parquet not found in $ARTIFACT_NAME."
            find /tmp/index_membership_artifact -maxdepth 4 -type f -print || true
            exit 1
          fi

          mkdir -p output/index_membership
          cp "$MEMBERSHIP_FILE" output/index_membership/index_membership_history.parquet

          python - <<'PY'
          import pandas as pd

          path = "output/index_membership/index_membership_history.parquet"
          df = pd.read_parquet(path)

          expected = ["index_id", "stock_id", "start_date", "end_date"]
          assert list(df.columns) == expected, f"Unexpected columns: {list(df.columns)}"
          assert df["index_id"].nunique() == 37, f"Expected 37 indexes, got {df['index_id'].nunique()}"
          assert len(df) > 0, "Membership parquet is empty"
          assert not df.duplicated().any(), "Duplicate rows found"
          assert not (df["start_date"] == "1900-01-01").any(), "1900-01-01 placeholder found"

          print(f"Index membership artifact validation PASS: {len(df)} rows, {df['index_id'].nunique()} indexes")
          PY

      - name: Merge & Split by Year (HF Mode)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
        run: |
          python scripts/merge_and_push.py --mode hf --year 0

      - name: Upload Index Membership History to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
        run: |
          python - <<'PY'
          import os
          from utils.hf_manager import HFManager

          local = "output/index_membership/index_membership_history.parquet"
          remote = "index_membership/index_membership_history.parquet"

          hf = HFManager(os.environ["HF_TOKEN"], os.environ["HF_REPO"])
          hf.upload_file(local, remote)
          print(f"Uploaded {local} -> {remote}")
          PY

      - name: Upload Sector Metadata to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
        run: |
          python -c "
          from utils.hf_manager import HFManager
          import glob, os
          hf = HFManager(os.environ['HF_TOKEN'], os.environ['HF_REPO'])
          for f in glob.glob('output/metadata/*'):
              hf.upload_file(f, f'metadata/{os.path.basename(f)}')
          print('✅ Sector metadata uploaded to HF.')
          "

      - name: Publish Consolidated Summaries to Workflow Page
        if: always()
        run: |
          if [ -f output/f10_audit_summary.md ]; then
            echo "---" >> $GITHUB_STEP_SUMMARY
            cat output/f10_audit_summary.md >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f output/mainbus_audit_summary.md ]; then
            echo "---" >> $GITHUB_STEP_SUMMARY
            cat output/mainbus_audit_summary.md >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f output/qc_summary.md ]; then
            echo "---" >> $GITHUB_STEP_SUMMARY
            cat output/qc_summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload QC & Audit Reports to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-qc-and-audit-reports
          path: |
            output/qc_report.json
            output/qc_summary.md
            output/f10_audit_summary.md
            output/mainbus_audit_summary.md
          retention-days: 7
