name: Probe BSE Disclosure Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Probe BSE page sources
        run: python test/probe_bse_disclosure_pages.py

      - name: Upload probe source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bse-disclosure-page-probe-\${{ github.run_id }}
          path: test/bse_page_probe
          if-no-files-found: ignore
          retention-days: 7
