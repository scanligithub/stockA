name: Build All A-share Delisted Stock Universe

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1-5"

permissions:
  contents: read

jobs:
  build-all-delisted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Build all A-share delisted stock universe
        run: python scripts/download_all_delisted_stocks.py

      - name: Verify unified result
        run: |
          python - <<'PY'
          import pandas as pd

          p = "data/universe/a_share_delisted_all.csv"
          df = pd.read_csv(p, dtype={"code": str, "current_code": str})
          print(f"ALL UNIQUE DELISTED: {len(df)}")
          print(df.groupby("exchange").size().to_string())
          print("columns:", list(df.columns))

          assert len(df) >= 350, f"unexpectedly low total: {len(df)}"
          assert df["code"].str.fullmatch(r"\d{6}").all()
          assert not df.duplicated(["exchange", "code"]).any()
          assert set(df["exchange"]) == {"SSE", "SZSE", "BSE"}

          bse = df[df["exchange"] == "BSE"]
          expected = {"832317", "833874", "833994", "920305", "920680"}
          assert set(bse["code"]) == expected, (
              f"BSE delisted set mismatch: {sorted(set(bse['code']) ^ expected)}"
          )

          sse_szse = df[df["exchange"].isin(["SSE", "SZSE"])]
          assert len(sse_szse) >= 300, f"SSE/SZSE unexpectedly low: {len(sse_szse)}"
          assert sse_szse["delist_date"].notna().all()

          print("UNIFIED DELISTED VALIDATION PASS")
          PY

      - name: Upload production results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-delisted-stock-universe-${{ github.run_id }}
          path: |
            data/universe/a_share_delisted_all.csv
            data/universe/sse_delisted.csv
            data/universe/szse_delisted.csv
            data/universe/bse_delisted.csv
            data/universe/bse_termination_announcements.csv
            data/universe/bse_current_stocks.csv
            data/universe/bse_current_risk_stocks.csv
            data/universe/bse_code_mapping.csv
            data/universe/bse_historical_codes.csv
            data/universe/bse_old_code_aliases.csv
            data/universe/invalid_delisted_rows.csv
          if-no-files-found: error
          retention-days: 14
