name: Test BSE Terminated Stock List

on:
  push:
    paths:
      - "test/download_bse_terminated_stocks.py"
      - ".github/workflows/test-bse-terminated-stocks.yml"
  workflow_dispatch:
  schedule:
    - cron: "45 1 * * 1-5"

permissions:
  contents: read

jobs:
  download-bse-terminated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Download and verify BSE historical terminated stocks
        run: python test/download_bse_terminated_stocks.py

      - name: Show result
        run: |
          echo "=== BSE historical termination announcements ==="
          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("test/bse_termination_announcements.csv", dtype={"code": str})
          print(f"final termination announcement rows: {len(df)}")
          print(f"unique terminated codes: {df['code'].nunique()}")
          print(df.to_string(index=False))
          PY

          echo "=== BSE current risk board ==="
          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("test/bse_current_risk_stocks.csv", dtype={"code": str})
          print(f"risk-board rows: {len(df)}")
          print(df.to_string(index=False))
          PY

          echo "=== BSE final delisted codes ==="
          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("test/bse_delisted.csv", dtype={"code": str})
          print(f"delisted codes: {len(df)}")
          print(df.to_string(index=False))
          PY

          echo "=== BSE historical code universe ==="
          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("test/bse_historical_codes.csv", dtype={"code": str, "current_code": str})
          print(f"historical code rows: {len(df)}")
          print(df.to_string(index=False))
          PY

      - name: Upload result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bse-terminated-stocks-${{ github.run_id }}
          path: |
            test/bse_delisted.csv
            test/bse_historical_codes.csv
            test/bse_old_code_aliases.csv
            test/bse_termination_announcements.csv
            test/bse_current_risk_stocks.csv
            test/bse_current_stocks.csv
            test/bse_code_mapping.csv
          if-no-files-found: error
          retention-days: 14
