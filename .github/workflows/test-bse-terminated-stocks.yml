name: Test BSE Terminated Stock List

on:
  workflow_dispatch:
  schedule:
    - cron: "45 1 * * 1-5"

permissions:
  contents: read

jobs:
  download-bse-terminated:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pypdf requests

      - name: Download and verify BSE terminated-listing stocks
        run: python test/download_bse_terminated_stocks.py

      - name: Show result
        run: |
          echo "=== BSE discovery ==="
          wc -l test/bse_termination_announcements.csv
          python - <<'PY'
          import pandas as pd

          ann = pd.read_csv("test/bse_termination_announcements.csv", dtype={"code": str})
          print(f"unique matched announcements: {len(ann)}")
          print(f"candidate company codes: {ann['code'].nunique()}")
          print(ann[["code", "name", "publish_time", "title"]].to_string(index=False))
          PY

          echo "=== BSE confirmed terminated listings ==="
          wc -l test/bse_delisted.csv
          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("test/bse_delisted.csv", dtype={"code": str})
          print(f"confirmed: {df['code'].nunique()}")
          print(f"type counts: {df['termination_type'].value_counts(dropna=False).to_dict()}")
          print(f"date range: {df['terminate_date'].min()} -> {df['terminate_date'].max()}")
          print(df.to_string(index=False))
          PY

          echo "=== BSE unresolved ==="
          if [ -f test/bse_termination_unresolved.csv ]; then
            wc -l test/bse_termination_unresolved.csv
            cat test/bse_termination_unresolved.csv
          fi

      - name: Upload result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bse-terminated-stocks-${{ github.run_id }}
          path: |
            test/bse_delisted.csv
            test/bse_termination_announcements.csv
            test/bse_termination_unresolved.csv
          if-no-files-found: error
          retention-days: 14
