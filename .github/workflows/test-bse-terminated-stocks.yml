name: Test BSE Terminated Stock List

on:
  workflow_dispatch:
  schedule:
    - cron: "45 1 * * 1-5"

permissions:
  contents: read

jobs:
  download-bse-terminated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Download and verify BSE terminated-listing stocks
        run: python test/download_bse_terminated_stocks.py

      - name: Show result
        run: |
          echo "=== BSE matched announcements ==="
          wc -l test/bse_termination_announcements.csv
          python - <<'PY'
          import pandas as pd

          ann = pd.read_csv("test/bse_termination_announcements.csv", dtype={"code": str})
          print(f"matched announcements: {len(ann)}")
          print(f"candidate company codes: {ann['code'].nunique()}")
          print(ann[["code", "name", "publish_time", "title", "termination_signal"]].to_string(index=False))
          PY

          echo "=== BSE terminated stock candidates ==="
          wc -l test/bse_delisted.csv
          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("test/bse_delisted.csv", dtype={"code": str})
          print(f"unique candidate stocks: {df['code'].nunique()}")
          print(df.to_string(index=False))
          PY

      - name: Upload result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bse-terminated-stocks-${{ github.run_id }}
          path: |
            test/bse_delisted.csv
            test/bse_termination_announcements.csv
          if-no-files-found: error
          retention-days: 14
