name: Test Sina XiangGuan Full Stock Universe

on:
  workflow_dispatch:
  push:
    paths:
      - "test/tdx_index_api/test_sina_xiangguan_full_universe.py"
      - "test/tdx_index_api/delisted_stock_codes.txt"
      - ".github/workflows/test-sina-xiangguan-full-universe.yml"

jobs:
  test-sina-xiangguan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests beautifulsoup4

      - name: Build TDX current stock universe
        working-directory: test/tdx_index_api
        run: |
          go mod tidy

          cat > /tmp/build_tdx_universe.go <<'EOF'
          package main

          import (
            "encoding/json"
            "fmt"
            "os"
            "strings"

            "github.com/injoyai/tdx"
            "github.com/injoyai/tdx/protocol"
          )

          type Stock struct {
            Code string `json:"code"`
            Name string `json:"name"`
            Market string `json:"market"`
          }

          func main() {
            client, err := tdx.DialDefault()
            if err != nil { panic(err) }
            defer client.Close()

            var all []Stock

            // Same TDX server mechanism as stockA/scripts/tdx_fetcher.go.
            exchanges := []struct {
              name string
              ex protocol.Exchange
            }{
              {"SH", protocol.ExchangeSH},
              {"SZ", protocol.ExchangeSZ},
              {"BJ", protocol.ExchangeBJ},
            }

            for _, m := range exchanges {
              resp, err := client.GetCodeAll(m.ex)
              if err != nil {
                panic(fmt.Errorf("%s: %w", m.name, err))
              }
              if resp == nil {
                panic(fmt.Errorf("%s: empty response", m.name))
              }

              for _, item := range resp.List {
                code := strings.TrimSpace(item.Code)
                name := strings.TrimSpace(item.Name)
                if len(code) != 6 {
                  continue
                }

                keep := false
                switch m.name {
                case "SH":
                  keep = strings.HasPrefix(code, "60") ||
                    strings.HasPrefix(code, "68")
                case "SZ":
                  keep = strings.HasPrefix(code, "00") ||
                    strings.HasPrefix(code, "30")
                case "BJ":
                  keep = strings.HasPrefix(code, "43") ||
                    strings.HasPrefix(code, "83") ||
                    strings.HasPrefix(code, "87") ||
                    strings.HasPrefix(code, "88") ||
                    strings.HasPrefix(code, "92")
                }

                if keep {
                  all = append(all, Stock{
                    Code: code,
                    Name: name,
                    Market: m.name,
                  })
                }
              }
            }

            seen := map[string]bool{}
            out := make([]Stock, 0, len(all))
            for _, stock := range all {
              if !seen[stock.Code] {
                seen[stock.Code] = true
                out = append(out, stock)
              }
            }

            f, err := os.Create("stock_list_master.json")
            if err != nil { panic(err) }
            defer f.Close()

            enc := json.NewEncoder(f)
            enc.SetIndent("", "  ")
            if err := enc.Encode(out); err != nil {
              panic(err)
            }

            fmt.Printf("TDX current A-share stocks (SH/SZ/BJ): %d\n", len(out))
          }
          EOF

          go run /tmp/build_tdx_universe.go

      - name: Restore/cache Sina XiangGuan HTML
        id: sina-cache
        uses: actions/cache@v4
        with:
          path: test/tdx_index_api/sina_xiangguan_cache
          key: ${{ runner.os }}-sina-xiangguan-v2-${{ hashFiles('test/tdx_index_api/stock_list_master.json', 'test/tdx_index_api/delisted_stock_codes.txt') }}
          restore-keys: |
            ${{ runner.os }}-sina-xiangguan-v2-

      - name: Report Sina cache status
        working-directory: test/tdx_index_api
        run: |
          echo "Exact cache hit: ${{ steps.sina-cache.outputs.cache-hit }}"
          echo "Cached HTML files before test:"
          find sina_xiangguan_cache -maxdepth 1 -type f -name '*.html' | wc -l
          du -sh sina_xiangguan_cache 2>/dev/null || true

      - name: Run full-universe Sina XiangGuan test
        working-directory: test/tdx_index_api
        env:
          SINA_WORKERS: "16"
          SINA_DELAY: "0.15"
        run: |
          python test_sina_xiangguan_full_universe.py

      - name: Save updated Sina XiangGuan HTML cache
        if: always() && steps.sina-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: test/tdx_index_api/sina_xiangguan_cache
          key: ${{ runner.os }}-sina-xiangguan-v2-${{ hashFiles('test/tdx_index_api/stock_list_master.json', 'test/tdx_index_api/delisted_stock_codes.txt') }}

      - name: Report Sina cache after test
        if: always()
        working-directory: test/tdx_index_api
        run: |
          echo "Sina HTML files after test:"
          find sina_xiangguan_cache -maxdepth 1 -type f -name '*.html' | wc -l
          du -sh sina_xiangguan_cache 2>/dev/null || true

      - name: Verify test outputs
        if: always()
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "TDX universe (from TDX server):"
          ls -lh "$GITHUB_WORKSPACE/test/tdx_index_api/stock_list_master.json" 2>/dev/null || true
          echo "Supplied delisted code list:"
          wc -l "$GITHUB_WORKSPACE/test/tdx_index_api/delisted_stock_codes.txt" 2>/dev/null || true
          echo "Sina output directory:"
          find "$GITHUB_WORKSPACE/test/tdx_index_api/sina_xiangguan_full_universe" \
            -maxdepth 1 -type f -print 2>/dev/null | sort || true

      - name: Upload XiangGuan test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sina-xiangguan-full-universe
          path: |
            ${{ github.workspace }}/test/tdx_index_api/sina_xiangguan_full_universe/**
            ${{ github.workspace }}/test/tdx_index_api/stock_list_master.json
          if-no-files-found: warn
          retention-days: 14
